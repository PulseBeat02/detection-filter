name: Build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  VLC_COMMIT: 045b920433197a9e8cbcf5a6566f6475ea3edbb8

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            shell: bash
            msystem: ''
            simd: -Denable_avx2=true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            shell: bash
            msystem: ''
            simd: -Denable_avx2=false -Denable_neon=true
          - name: windows-x64
            os: windows-2025
            shell: msys2 {0}
            msystem: UCRT64
            openmp: ''
            simd: -Denable_avx2=true
          - name: windows-arm64
            os: windows-11-arm
            shell: msys2 {0}
            msystem: CLANGARM64
            openmp: llvm-openmp:p
            simd: -Denable_avx2=false -Denable_neon=true
          - name: macos-x64
            os: macos-15-intel
            shell: bash
            msystem: ''
            simd: -Denable_avx2=true
          - name: macos-arm64
            os: macos-15
            shell: bash
            msystem: ''
            simd: -Denable_avx2=false -Denable_neon=true

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config bison flex pipx
          pipx install meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config libomp bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          LIBOMP=$(brew --prefix libomp)
          echo "CPPFLAGS=-I$LIBOMP/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$LIBOMP/lib" >> "$GITHUB_ENV"

      - name: Install MSYS2 deps
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: bison flex curl
          pacboy: >-
            cc:p
            meson:p
            ninja:p
            pkgconf:p
            ${{ matrix.openmp }}

      - name: Build VLC 4 core
        run: |
          WORK="$RUNNER_TEMP"
          PREFIX="$WORK/vlc4"
          if [ "$RUNNER_OS" = "Windows" ]; then
            WORK=$(cygpath -u "$RUNNER_TEMP")
            PREFIX=$(cygpath -m "$RUNNER_TEMP/vlc4")
          fi
          curl -fsSL "https://code.videolan.org/videolan/vlc/-/archive/$VLC_COMMIT/vlc-$VLC_COMMIT.tar.gz" | tar -xz -C "$WORK"
          cd "$WORK/vlc-$VLC_COMMIT"
          meson setup build -Dbuildtype=release "-Dprefix=$PREFIX" -Dauto_features=disabled \
            -Davcodec=disabled -Davformat=disabled -Dpng=disabled -Dzvbi=disabled -Dlua=disabled \
            -Dscreen=disabled -Dswscale=disabled
          meson compile -C build
          meson install -C build
          LIB_DIR=$(dirname "$(find "$PREFIX" \( -name libvlccore.so -o -name libvlccore.dylib -o -name libvlccore.dll.a \) -print -quit)")
          PLUGIN_INCLUDE_DIR=$(dirname "$(find "$PREFIX" -name vlc_plugin.h -print -quit)")
          INCLUDE_DIR=$(dirname "$(dirname "$PLUGIN_INCLUDE_DIR")")
          PKG_DIR="$PREFIX/lib/pkgconfig"
          mkdir -p "$PKG_DIR"
          {
            grep '^Version:' "$(find "$PREFIX" -name libvlc.pc -print -quit)"
            echo 'Name: VLC plugin API'
            echo 'Description: VLC media player plugin interface'
            echo "Cflags: -I$INCLUDE_DIR -I$PLUGIN_INCLUDE_DIR -D_FILE_OFFSET_BITS=64"
            echo "Libs: -L$LIB_DIR -lvlccore"
          } > "$PKG_DIR/vlc-plugin.pc"
          cat "$PKG_DIR/vlc-plugin.pc"
          echo "VLC_PKG_CONFIG_PATH=$PKG_DIR" >> "$GITHUB_ENV"

      - name: Configure
        run: meson setup build -Dbuildtype=release "-Dpkg_config_path=$VLC_PKG_CONFIG_PATH" -Dbuild_vlc_plugin=true -Dopenmp=true ${{ matrix.simd }}

      - name: Build
        run: meson compile -C build

      - name: Stage artifacts
        run: |
          meson install -C build
          mkdir -p dist
          tar -czf "dist/detection-filter-${{ matrix.name }}.tar.gz" -C build/vlc-plugins video_filter
          tar -tzf "dist/detection-filter-${{ matrix.name }}.tar.gz"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: detection-filter-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [ build ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -la artifacts/

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_BODY=$(git log -1 --pretty=%b)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="$TAG - $COMMIT_SUBJECT"
            PRERELEASE=false
          else
            DATE=$(date -u +'%Y-%m-%d')
            TAG="build-${DATE}-${SHORT_SHA}"
            NAME="${DATE} - ${COMMIT_SUBJECT}"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "name<<META_EOF"
            echo "$NAME"
            echo "META_EOF"
            echo "body<<META_EOF"
            echo "Automated build from commit \`$SHORT_SHA\` (${GITHUB_SHA})."
            echo ""
            echo "**$COMMIT_SUBJECT**"
            if [ -n "$COMMIT_BODY" ]; then
              echo ""
              echo "$COMMIT_BODY"
            fi
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
